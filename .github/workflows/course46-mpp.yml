name: Build coursework 46 native MPP

on:
  push:
    branches: [codex/course46-mpp-export]
    paths: [.github/workflows/course46-mpp.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get pinned MPP writer
        run: |
          git init "$RUNNER_TEMP/mppkit"
          git -C "$RUNNER_TEMP/mppkit" fetch --depth=1 https://github.com/Molch-ApS/MPPKit.git a47fdec1e70e5ea8e9db17249dd265b1a9eacc26
          git -C "$RUNNER_TEMP/mppkit" checkout --detach FETCH_HEAD
      - name: Build and round-trip the course schedule
        env:
          INPUT: ${{ github.workspace }}/01-project-plan/2026-B1/Kursova_46_Project.xml
          OUTPUT: ${{ github.workspace }}/Kursova_46_Project.mpp
        run: |
          cd "$RUNNER_TEMP/mppkit"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Sources/MPP14/MPP14Writer.swift")
          s = p.read_text()
          def change(a, b):
              global s
              assert s.count(a) == 1, a
              s = s.replace(a,b)
          change("project.recalculateCosts(keepingFrom: source)",
                 "// The exported coursework input already contains its modeled costs.")
          change("let assignmentWork = project.assignmentWorkHours(keepingFrom: source).map { $0 * 600 * W.workScale }",
                 "let assignmentWork = project.assignments.map { $0.workHours * 600 * W.workScale }")
          change("""directWork[a.taskUID, default: 0] += keptWork[i] ? assignmentWork[i]
                          : Double(eff[a.taskUID]!.tenths) * W.workScale * a.units""",
                 "directWork[a.taskUID, default: 0] += assignmentWork[i]")
          change("var done = sum * Double(pct[t.uid] ?? 0) / 100",
                 "var done = (t.numbers[4] ?? 0) * 600 * W.workScale")
          change("""let workPercent = workPercent ?? percent
                      e.u16(F.percentWorkComplete, UInt16(workPercent))""",
                 """let measured = task?.numbers[4].map { $0 * 600 * W.workScale }
                      let workPercent = measured.map { work > 0 ? Int.clamped($0 / work * 100) : 0 } ?? workPercent ?? percent
                      e.u16(F.percentWorkComplete, UInt16(workPercent))""")
          change("""e.f64(F.actualWork, work * Double(workPercent) / 100)
                          e.f64(F.remainingWork, work * Double(100 - workPercent) / 100)""",
                 """let exact = measured ?? work * Double(workPercent) / 100
                          e.f64(F.actualWork, exact)
                          e.f64(F.remainingWork, work - exact)""")
          change("let work = keepsWork ? assignmentWork[n] : Double(tenths) * W.workScale * spec.units",
                 "let work = n < assignmentWork.count ? assignmentWork[n] : 0")
          change("""let p = pct[spec.task] ?? 0
                      var reached""",
                 """let p = pct[spec.task] ?? 0
                      let actual = (task.numbers[4] ?? 0) * 600 * W.workScale
                      var reached""")
          change("remainingWork = work * Double(100 - p) / 100", "remainingWork = work - actual")
          change("e.f64(A.actualWork, work * Double(p) / 100)", "e.f64(A.actualWork, actual)")
          change("e.u16(A.percentWorkComplete, UInt16(p))", "e.u16(A.percentWorkComplete, UInt16(work > 0 ? Int.clamped(actual / work * 100) : 0))")
          change("Self.actualWorkContour(units: spec.units, work: work * Double(p) / 100,",
                 "Self.actualWorkContour(units: spec.units, work: actual,")
          p.write_text(s)
          PY
          mv Sources/mppdump/main.swift "$RUNNER_TEMP/mppdump-original.swift"
          cat > Sources/mppdump/main.swift <<'SWIFT'
          // SPDX-License-Identifier: AGPL-3.0-only
          import Foundation
          import FoundationXML
          import MPPKit

          let input = URL(fileURLWithPath: ProcessInfo.processInfo.environment["INPUT"]!)
          let output = URL(fileURLWithPath: ProcessInfo.processInfo.environment["OUTPUT"]!)
          let sourceData = try Data(contentsOf: input)
          var p = try MSPDI.project(from: sourceData)
          let doc = try XMLDocument(data: sourceData)
          func children(_ parent: XMLElement, _ key: String) -> [XMLElement] {
              parent.elements(forLocalName: key, uri: "http://schemas.microsoft.com/project")
          }
          func string(_ element: XMLElement, _ key: String) -> String {
              children(element, key).first?.stringValue ?? ""
          }
          func amount(_ element: XMLElement, _ key: String) -> Double {
              Double(string(element, key)) ?? 0
          }
          func hours(_ element: XMLElement, _ key: String) -> Double {
              let value = string(element, key)
              return Double(value.dropFirst(2).prefix(while: { $0 != "H" })) ?? 0
          }
          func lookup(_ group: String, _ item: String, key: String = "UID") -> [Int:XMLElement] {
              Dictionary(uniqueKeysWithValues: children(children(doc.rootElement()!, group)[0], item).map {
                  (Int(amount($0, key)), $0)
              })
          }
          let tasks = lookup("Tasks","Task")
          let resources = lookup("Resources","Resource")
          let assignments = lookup("Assignments","Assignment", key: "TaskUID")
          p.title = "Створення корпоративного порталу підприємства — курсова №46"
          p.currencyCode = "USD"
          p.comments = "Базовий календар 07.09–15.12.2026, 72 робочі дні. Контроль 06.11.2026. Прогноз 17.12.2026. PV 31720 USD, EV 29836 USD, AC 30437 USD. Фактичні дані змодельовано."
          p.fieldAliases["number1"] = "PV: курсова, USD"
          p.fieldAliases["number2"] = "EV: курсова, USD"
          p.fieldAliases["number3"] = "AC: курсова, USD"
          p.fieldAliases["number4"] = "Фактична робота, год"
          p.fieldAliases["number5"] = "Фізичне виконання, %"
          for i in p.tasks.indices {
              let t = tasks[p.tasks[i].uid]!
              p.tasks[i].cost = amount(t,"Cost")
              p.tasks[i].actualCost = amount(t,"ActualCost")
              p.tasks[i].workHours = hours(t,"Work")
              p.tasks[i].baselines[0]?.cost = amount(children(t,"Baseline")[0],"Cost")
              p.tasks[i].numbers = [1: amount(t,"BCWS"), 2: amount(t,"BCWP"), 3: amount(t,"ACWP"), 4: hours(t,"ActualWork"), 5: amount(t,"PhysicalPercentComplete")]
          }
          let sourceByUID = Dictionary(uniqueKeysWithValues: p.tasks.map { ($0.uid, $0) })
          for i in p.resources.indices {
              let row = resources[p.resources[i].uid]!
              let rate = amount(row,"StandardRate")
              p.resources[i].costRateTables = [[PayRate(standardPerHour: rate, overtimePerHour: rate)]]
              let b = children(row,"Baseline")[0]
              p.resources[i].baselines[0] = Baseline(workHours: hours(b,"Work"), cost: amount(b,"Cost"))
          }
          for i in p.assignments.indices {
              let row = assignments[p.assignments[i].taskUID]!
              p.assignments[i].cost = amount(row,"Cost")
              p.assignments[i].actualCost = amount(row,"ActualCost")
              p.assignments[i].baselines[0] = sourceByUID[p.assignments[i].taskUID]?.baselines[0]
          }
          let template = URL(fileURLWithPath: "Samples/Blank-Template.mpp")
          try MPP14Writer(templateURL: template).write(p, to: output)
          let back = try MPP14File(path: output.path).readProject()
          precondition(back.tasks.count == 28 && back.resources.count == 10 && back.assignments.count == 28 && back.relations.count == 51)
          precondition(back.statusDate == p.statusDate && back.start == p.start)
          for t in back.tasks {
              let expected = sourceByUID[t.uid]!
              precondition(t.name == expected.name && t.start == expected.start && t.finish == expected.finish && t.wbs == expected.wbs, "Task dates/title \(t.uid)")
              precondition(t.baselines[0]?.start == expected.baselines[0]?.start && t.baselines[0]?.finish == expected.baselines[0]?.finish, "Baseline dates \(t.uid)")
              precondition(abs((t.baselines[0]?.cost ?? -1) - (expected.baselines[0]?.cost ?? -2)) < 0.01, "Baseline cost \(t.uid)")
              precondition(abs(t.actualCost - expected.actualCost) < 0.01, "Actual cost \(t.uid)")
          }
          precondition(abs(back.tasks.reduce(0) { $0 + ($1.baselines[0]?.cost ?? 0) } - 40308) < 0.01)
          precondition(abs(back.tasks.reduce(0) { $0 + $1.actualCost } - 30437) < 0.01)
          for r in back.resources {
              precondition(abs((r.costRateTables.first?.first?.standardPerHour ?? -1) - amount(resources[r.uid]!, "StandardRate")) < 0.01, "Rate \(r.uid)")
          }
          print("Verified: 28 tasks, 10 roles, 28 assignments, 51 links, status date, all task dates, all baseline dates and costs, all resource rates, all actual costs.")
          SWIFT
          swift run -c release mppdump
      - uses: actions/upload-artifact@v6
        with:
          name: coursework-46-mpp
          path: Kursova_46_Project.mpp
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: coursework-46-mpp
      - name: Publish the verified binary on the export branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPORT_BRANCH: codex/course46-mpp-export
        run: |
          python3 - <<'PY' | gh api --method PUT "repos/$GH_REPO/contents/01-project-plan/2026-B1/Kursova_46_Project.mpp" --input - --jq .commit.sha
          import base64, json, os
          from pathlib import Path
          data = Path("Kursova_46_Project.mpp").read_bytes()
          assert data[:8] == bytes.fromhex("d0cf11e0a1b11ae1")
          print(json.dumps({"branch": os.environ["EXPORT_BRANCH"], "message": "Publish verified native Microsoft Project file", "content": base64.b64encode(data).decode()}))
          PY
